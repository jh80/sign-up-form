<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up With Odin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <aside>
        <!-- <div></div> -->
        <div class="aside-banner">
            <img class="banner-logo" src="https://raw.githubusercontent.com/TheOdinProject/curriculum/5f37d43908ef92499e95a9b90fc3cc291a95014c/html_css/project-sign-up-form/odin-lined.png" alt="The Odin Project Logo Norse God Odin Graphic">
            <h1>Odin</h1>
        </div>
        <cite>
            photo by <a href="https://unsplash.com/photos/a-humpback-whale-swims-under-the-surface-of-the-water-P19iVmm7XUA">Chinh Le Duc</a> on <a href="https://unsplash.com/photos/a-humpback-whale-swims-under-the-surface-of-the-water-P19iVmm7XUA">Upsplash</a>
        </cite>
    </aside>
    <div class="page-base">
        <div class="form-case intro">
            <section class="intro">
                <p>
                    This is not a real online service! You know
                    you need something like this in your life to
                    help you realize your deepest dreams. Sign up <em>now</em> to get started.
                </p>
                <p id="persuasion">You <em>know</em> you want to.</p>                
            </section>
        </div>
        <form method="get">
            <div class="form-body">
                <h2>Let's do this!</h2>
                <div class="form-info">
                        <section class="info-category">
                        <div class="form-input">
                            <label for="first-name">FIRST NAME</label>
                            <input type="text" id="first-name" name="user-first-name">
                        </div>
                        <div class="form-input">
                            <label for="last-name">LAST NAME</label>
                            <input type="text" id="last-name" name="user-last-name">
                        </div>                    
                    </section>
                    <section class="info-category">
                        <div class="form-input">
                            <label for="email">EMAIL</label>
                            <input type="email" id="email" name="user-email">
                        </div>
                        <div class="form-input">
                            <label for="phone-number">PHONE NUMBER</label>
                            <input type="number" id="phone-number" name="user-phone-number">
                        </div>
                    </section>
                    <section class="info-category">
                        <div class="form-input">
                            <label for="password">PASSWORD</label>
                            <input type="text" id="password" name="user-password" pattern="\d{4}[a-zA-z]{4}">
                        </div>
                        <div class="form-input">
                            <label for="password-confirmation">CONFIRM PASSWORD</label>
                            <input type="text" id="password-confirmation" name="user-password-confirmation">
                        </div>
                    </section>
                </div>
            </div>
            <button>Create Account</button>
        </form>
        <div class="form-case end">
            <section>
                <p class="end">Already have an account? <a href="">Log in.</a></p>
            </section>
        </div>
    </div>
</body>
</html>
